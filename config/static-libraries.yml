  - id: msvc-crt-static
    family: Microsoft Visual C++ C Runtime
    version: "6.0"
    status: exact-precompiled-candidate
    scope:
      - vc6-rtm/libcmt.lib
      - vc6-sp3/libcmt.lib
      - vc6-sp4/libcmt.lib
      - vc6-sp5/libcmt.lib
      - vc6-sp6/libcmt.lib
    evidence:
      - The pinned archaic-msvc RTM and service-pack snapshots contain exact multithreaded static CRT archives.
      - Wizardry first-party modules import MSVCRT.dll, so matches from this archive are support-code evidence rather than proof that the game used /MT.
    source: null
    seed_variants: []

  - id: msvc-cpp-static
    family: Microsoft Visual C++ Standard C++ Library
    version: "6.0"
    status: exact-precompiled-candidate
    scope:
      - vc6-rtm-through-sp4/libcpmt.lib
      - vc6-sp5-through-sp6/libcpmt.lib
    evidence:
      - RTM, SP3, and SP4 share one byte-identical archive; SP5, Processor Pack, and SP6 share a second byte-identical archive.
      - Wizardry first-party modules import MSVCP60.dll, so matches must be interpreted conservatively.
    source: null
    seed_variants: []

