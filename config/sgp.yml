schema: wiz8.sgp-harness
source_revision: 5ac0a9d56d27e8a7e2c4a7b48ed8932ae7f64033
source_root: third_party/sfi-sgp/sgp
toolchain: vc6-sp5

# Settled Wizardry SGP static-library release profile. Every configured unit
# compiles exactly once with these project-wide flags.
project_flags: [/O2, /Ob2, /G5, /MD]

near_match_threshold: 0.75
report: build/reports/sgp/harness.csv
snapshot: evidence/snapshots/sgp/harness.csv

builds:
  - {id: demo, variant: demo, module: Wiz8.EXE}
  - {id: gog_base, variant: gog-base, module: Wiz8.exe}
  - {id: gog_1261, variant: gog-1261, module: Wiz8.exe}
  - {id: gog_1261_new, variant: gog-1261, module: Wiz8New.exe}
  - {id: gog_128_base, variant: gog-128, module: Wiz8.exe}
  - {id: gog_128_patch, variant: gog-128, module: Wiz8_v128.exe}
  - id: retail_2001_12_23
    variant: retail-2001-12-23
    module: Wiz8.exe
    static_matching: unavailable
    unavailable_reason: protected-executable

units:
  - id: directdraw
    target: WIZ8_SGP_DIRECTDRAW
    source: DirectDraw Calls.c
    overlay: directdraw
  - id: random
    target: WIZ8_SGP_RANDOM
    source: Random.c
    overlay: random
  - id: compression
    target: WIZ8_SGP_COMPRESSION
    source: Compression.c
    overlay: compression
  - id: fileman
    target: WIZ8_SGP_FILEMAN
    source: FileMan.c
    overlay: fileman
  - id: librarydatabase
    target: WIZ8_SGP_LIBRARY_DATABASE
    source: LibraryDataBase.c
    overlay: librarydatabase
  - id: dbman
    target: WIZ8_SGP_DBMAN
    source: DbMan.c
    overlay: dbman
  - id: container
    target: WIZ8_SGP_CONTAINER
    source: Container.c
    overlay: container
  - id: debug
    target: WIZ8_SGP_DEBUG
    source: DEBUG.C
    overlay: debug
  - id: exceptionhandling
    target: WIZ8_SGP_EXCEPTION_HANDLING
    source: ExceptionHandling.cpp
    overlay: exceptionhandling
    expected_empty: true
  - id: sgp
    target: WIZ8_SGP_CORE
    source: sgp.c
    overlay: sgp
    functions: [GetRuntimeSettings, ProcessCommandLine]
  - id: timer
    target: WIZ8_SGP_TIMER
    source: timer.c
    overlay: timer
  - id: input
    target: WIZ8_SGP_INPUT
    source: input.c
    overlay: input
    functions:
      - KeyboardHandler
      - MouseHandler
      - InitializeInputManager
      - ShutdownInputManager
      - QueueEvent
      - DequeueEvent
      - FreeMouseCursor
      - GetMouseWheelDeltaValue
