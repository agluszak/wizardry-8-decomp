name: Install pinned Ghidra
description: >-
  Java 21 and the pinned Ghidra release named by the workflow's GHIDRA_ARCHIVE,
  GHIDRA_SHA256 and GHIDRA_INSTALL_DIR.

runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: "21"

    - name: Install pinned Ghidra
      shell: bash
      run: |
        set -euo pipefail
        archive="$RUNNER_TEMP/$GHIDRA_ARCHIVE"
        curl --fail --location --retry 3 --output "$archive" \
          "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/$GHIDRA_ARCHIVE"
        echo "$GHIDRA_SHA256  $archive" | sha256sum --check -
        mkdir -p "$(dirname "$GHIDRA_INSTALL_DIR")"
        unzip -q "$archive" -d "$(dirname "$GHIDRA_INSTALL_DIR")"
        test -x "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"

    - name: Build pinned native inline fixes
      shell: bash
      run: |
        set -euo pipefail
        revision=acc74ac07b331f54a42fafe1b51c708f6741b5e1
        installer="$RUNNER_TEMP/buildPatchedDecompiler.sh"
        curl --fail --location --retry 3 --output "$installer" \
          "https://raw.githubusercontent.com/agluszak/ghidra/$revision/support/buildPatchedDecompiler.sh"
        bash "$installer" "$GHIDRA_INSTALL_DIR"
