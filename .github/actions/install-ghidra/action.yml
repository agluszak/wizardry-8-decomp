name: Install pinned Ghidra
description: >-
  Java 25 and the fork distribution named by the workflow's GHIDRA_REVISION,
  GHIDRA_SHA256 and GHIDRA_INSTALL_DIR.

runs:
  using: composite
  steps:
    - name: Set up Java 25
      uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
      with:
        distribution: temurin
        java-version: "25"

    - name: Install pinned fork distribution
      shell: bash
      run: |
        set -euo pipefail
        installer="$RUNNER_TEMP/installForkDistribution.sh"
        curl --fail --location --retry 3 --output "$installer" \
          "https://raw.githubusercontent.com/agluszak/ghidra/$GHIDRA_REVISION/support/installForkDistribution.sh"
        bash "$installer" "$GHIDRA_REVISION" "$GHIDRA_SHA256" "$GHIDRA_INSTALL_DIR"
