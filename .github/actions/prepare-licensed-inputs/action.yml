name: Prepare licensed Wizardry runtime inputs
description: Materialize the canonical installer and full runtime game tree.

inputs:
  inputs-token:
    description: Token with read access to the private CI input repository.
    required: true
  cache-key:
    description: Symmetric key used only to decrypt/encrypt licensed cache payloads.
    required: true

runs:
  using: composite
  steps:
    - name: Materialize canonical GOG installer
      uses: ./.github/actions/materialize-gog-installer
      with:
        inputs-token: ${{ inputs.inputs-token }}
        cache-key: ${{ inputs.cache-key }}

    - name: Restore public FID source cache
      uses: actions/cache@v4
      with:
        path: ${{ env.WIZ8_WORK_DIR }}/fid/sources
        key: wiz8-fid-sources-v1-${{ hashFiles('config/static-libraries.yml', 'tools/wiz8decomp/ghidra/fid_seeds.py') }}

    - name: Restore pinned runtime toolchain cache
      uses: actions/cache@v4
      with:
        path: ${{ env.WIZ8_WORK_DIR }}/runtime-toolchain
        key: wiz8-runtime-toolchain-v1-${{ runner.os }}-${{ hashFiles('tools/wiz8decomp/runtime_toolchain.py') }}

    - name: Prepare full runtime corpus
      shell: bash
      run: uv run wiz8 prepare
