name: Finalize source-model cleanup

on:
  push:
    branches:
      - fix/source-model-type-boundaries

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-model-type-boundaries
          fetch-depth: 0
      - name: Apply asserted patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path

          workflow = Path('.github/workflows/source-model-cleanup.yml').read_text()
          match = re.search(r"b64decode\('([^']+)'\)", workflow)
          if not match:
              raise SystemExit('source-model patch payload not found')
          exec(zlib.decompress(base64.b64decode(match.group(1))).decode())

          combat = Path('src/wiz8/local_code/Combat.cpp')
          combat.write_text(combat.read_text().rstrip() + '\n')
          PY
      - name: Check patch formatting
        run: git diff --check
      - name: Commit source changes
        shell: bash
        run: |
          rm .github/workflows/source-model-cleanup.yml
          rm .github/workflows/source-model-cleanup-final.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover typed runtime state boundaries"
          git push origin HEAD:fix/source-model-type-boundaries
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Run repository checks
        run: |
          uv sync --frozen
          just check
