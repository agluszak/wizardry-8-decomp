name: Apply source-model cleanup

on:
  push:
    branches: [fix/source-model-type-boundaries]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-model-type-boundaries
          fetch-depth: 0

      - name: Apply source-model patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text()

          def store(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = load(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected exactly one occurrence, found {count}: {old[:80]!r}")
              store(path, text.replace(old, new, 1))

          def replace_all(path, old, new, minimum=1):
              text = load(path)
              count = text.count(old)
              if count < minimum:
                  raise RuntimeError(f"{path}: expected at least {minimum} occurrences, found {count}: {old[:80]!r}")
              store(path, text.replace(old, new))

          def replace_between(path, start, end, replacement):
              text = load(path)
              a = text.index(start)
              b = text.index(end, a)
              store(path, text[:a] + replacement + text[b:])

          def matching_brace(text, opening):
              depth = 0
              state = 'normal'
              i = opening
              while i < len(text):
                  ch = text[i]
                  nxt = text[i + 1] if i + 1 < len(text) else ''
                  if state == 'normal':
                      if ch == '/' and nxt == '/':
                          state = 'line'; i += 2; continue
                      if ch == '/' and nxt == '*':
                          state = 'block'; i += 2; continue
                      if ch == '"':
                          state = 'string'; i += 1; continue
                      if ch == "'":
                          state = 'char'; i += 1; continue
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return i
                  elif state == 'line':
                      if ch == '\n': state = 'normal'
                  elif state == 'block':
                      if ch == '*' and nxt == '/': state = 'normal'; i += 2; continue
                  elif state in ('string', 'char'):
                      quote = '"' if state == 'string' else "'"
                      if ch == '\\': i += 2; continue
                      if ch == quote: state = 'normal'
                  i += 1
              raise RuntimeError('unbalanced braces')

          def replace_function(path, marker, replacement):
              text = load(path)
              start = text.index(marker)
              opening = text.index('{', start)
              closing = matching_brace(text, opening)
              suffix = closing + 1
              while suffix < len(text) and text[suffix] in ' \t':
                  suffix += 1
              if suffix < len(text) and text[suffix] == '\n':
                  suffix += 1
              store(path, text[:start] + replacement.rstrip() + '\n\n' + text[suffix:])

          # The eight 0x118 records end exactly where the independently recovered
          # gXStatus global begins. Do not model the following globals as a tail.
          path = 'include/wiz8/local_code/MonsterManager.h'
          text = load(path)
          start = text.index('/* 0x004E6900 passes 0x006836B8 as this constructor\'s receiver.')
          end = text.index('\nextern W8MonsterManagerState g_monster_manager_state;', start)
          replacement = '''/* The manager-owned array ends at 0x00683F78: eight 0x118-byte records
   starting at 0x006836B8. 0x00683F78 is independently gXStatus, so the
   contiguous reset that reaches farther does not make those following globals
   members of this object. */
struct W8MonsterManagerState {
    W8MonsterManagerState();
    ~W8MonsterManagerState();

