name: Apply source-model cleanup

on:
  push:
    branches:
      - fix/source-model-type-boundaries

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-model-type-boundaries
          fetch-depth: 0
      - name: Apply patch
        run: python3 -c "import base64,zlib; exec(zlib.decompress(base64.b64decode('')).decode())"
      - name: Check patch formatting
        run: git diff --check
      - name: Commit source changes
        shell: bash
        run: |
          rm .github/workflows/source-model-cleanup.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover typed runtime state boundaries"
          git push origin HEAD:fix/source-model-type-boundaries
      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Run repository checks
        run: |
          uv sync --frozen
          just check
