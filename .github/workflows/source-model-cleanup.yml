            reinterpret_cast<const int*>(&g_environment_colours_65ad98[phase]));'''
          if direct in text:
              text = text.replace(direct, '        SetLightDirection(&g_environment_colours_65ad98[phase]);')
              n += 1
          if n < 2:
              raise RuntimeError(f'Environment.cpp: expected at least two light-direction bit-view blocks, replaced {n}')
          store(path, text)

          # Video2 consumes the same value as a colour and the overlay slot as a pointer.
          path = 'src/wiz8/engine_code/Video2.cpp'
          text = load(path)
          text = text.replace('// GLOBAL: WIZ8 0x659668\nint g_value_659668;', '// GLOBAL: WIZ8 0x659668\nconst int* g_value_659668;', 1)
          text = text.replace('void SetValue659668(int value)', 'void SetValue659668(const int* value)', 1)
          text = text.replace(
              '''        const int* overlay_viewport =
            reinterpret_cast<const int*>(g_value_659668);''',
              '        const int* overlay_viewport = g_value_659668;', 1)
          text = text.replace(
              '''        if (!IsSkyEnabled()) {
            GetWorldLightValue(g_world, reinterpret_cast<int*>(&clear_color));
        }''',
              '''        if (!IsSkyEnabled()) {
            EnvironmentColour ambient_light;
            GetWorldLightValue(g_world, &ambient_light);
            clear_color.x = ambient_light.red;
            clear_color.y = ambient_light.green;
            clear_color.z = ambient_light.blue;
        }''', 1)
          store(path, text)
          publish = r'''// FUNCTION: WIZ8 0x00427380
void PublishLightDirection(const EnvironmentColour* direction)
{
    srVector3T<float> color;
    color.x = direction->red;
    color.y = direction->green;
    color.z = direction->blue;
    if (g_gerd_659634 != 0) {
        g_gerd_659634->flush();
        g_gerd_659634->setFogColor(color);
    }
    if (g_world != 0) {
        g_world->static_scene->setFogColor(color);
    }
    if (g_world_659ab8 != 0) {
        g_world_659ab8->static_scene->setFogColor(color);
    }
}'''
          replace_function(path, '// FUNCTION: WIZ8 0x00427380', publish)

          path = 'src/wiz8/local_screens/AutomapScreen.cpp'
          text = load(path)
          text = text.replace('GetLightDirection(reinterpret_cast<int*>(&g_automap_saved_light_direction));', 'GetLightDirection(&g_automap_saved_light_direction);')
          text = text.replace('GetWorldLightValue(g_world, reinterpret_cast<int*>(&g_automap_saved_ambient_light));', 'GetWorldLightValue(g_world, &g_automap_saved_ambient_light);')
          text = text.replace('SetLightDirection(reinterpret_cast<const int*>(&direction));', 'SetLightDirection(&direction);')
          text = text.replace('SetLightDirection(reinterpret_cast<const int*>(&g_automap_saved_light_direction));', 'SetLightDirection(&g_automap_saved_light_direction);')
          store(path, text)

          # The octree always constructs and returns W8GameData. Its offset-zero
          # word has two proven roles depending on the data source, so model that
          # variant explicitly rather than using void** and a cross-type store.
          path = 'include/wiz8/engine_code/Octree.h'
          text = load(path)
          text = text.replace('struct W8World;\n', 'struct W8World;\nstruct W8GameData;\n', 1)
          text = text.replace('W8Octree(const char* path, void** game_data);', 'W8Octree(const char* path, W8GameData** game_data);', 1)
          store(path, text)
          path = 'include/wiz8/engine_code/GameData.h'
          text = load(path)
          text = text.replace('struct W8OctBuildTree00446390;\n', 'struct W8OctBuildTree00446390;\nclass W8Octree;\n', 1)
          text = text.replace(
              '    W8OctBuildTree00446390* geometry_index_00;\n',
              '''    union {
        W8OctBuildTree00446390* geometry_index_00;
        W8Octree* octree_00;
    };
''', 1)
          store(path, text)
          replace_once(
              'src/wiz8/engine_code/3dapi.cpp',
              'world->octree = new W8Octree(oct_path, (void**)&world->m_owned_04c);',
              'world->octree = new W8Octree(oct_path, &world->m_owned_04c);')
          path = 'src/wiz8/engine_code/Octree.cpp'
          text = load(path)
          text = text.replace('W8Octree::W8Octree(const char* path, void** game_data)', 'W8Octree::W8Octree(const char* path, W8GameData** game_data)', 1)
          text = text.replace('    void* pGameData = 0;', '    W8GameData* pGameData = 0;', 1)
          text = text.replace('        *static_cast<W8Octree**>(pGameData) = this;\n        *game_data = pGameData;\n        g_octree_game_data_00652db0 = static_cast<W8GameData*>(pGameData);', '        pGameData->octree_00 = this;\n        *game_data = pGameData;\n        g_octree_game_data_00652db0 = pGameData;', 1)
          store(path, text)

          # qsort already supplies the canonical void* comparator boundary.
          replace_once(
              'include/wiz8/utility.h',
              'int CompareSignedDescending(const int* first, const int* second);',
              'int CompareSignedDescending(const void* first, const void* second);')
          compare_desc = r'''// FUNCTION: WIZ8 0x00517a50
int CompareSignedDescending(const void* first, const void* second)
{
    int left = *static_cast<const int*>(first);
    int right = *static_cast<const int*>(second);
    if (left < right) {
        return 1;
    }
    if (left > right) {
        return -1;
    }
    return 0;
}'''
          replace_function('src/wiz8/local_code/UtilityFunctions.cpp', '// FUNCTION: WIZ8 0x00517a50', compare_desc)
          path = 'src/wiz8/local_code/CharGeneration.cpp'
          text = load(path)
          text = text.replace('reinterpret_cast<int (__cdecl*)(const void*, const void*)>(CompareSignedDescending)', 'CompareSignedDescending')
          text = text.replace(' /* reinterpret-ok: qsort\'s untyped C comparator ABI */', '')
          store(path, text)

          # Assert that the false manager-tail projections are gone.
          for p in Path('src').rglob('*.cpp'):
              source = p.read_text()
              if 'g_monster_manager_state.unknown_' in source:
                  raise RuntimeError(f'{p}: false manager-tail projection remains')
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          rm .github/workflows/source-model-cleanup.yml
          git config user.name "ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Recover typed runtime state boundaries"
          git push origin HEAD:fix/source-model-type-boundaries

      - uses: astral-sh/setup-uv@v6
      - uses: extractions/setup-just@v3
      - name: Run repository checks
        run: |
          uv sync --frozen
          just check
