name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GHIDRA_ARCHIVE: ghidra_12.1.4_PUBLIC_20260921.zip
  GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
  GOG_INSTALLER_NAME: setup_wizardry_8_2001_12_23_(22306).exe
  GOG_RELEASE_ASSET_NAME: setup_wizardry_8_2001_12_23_.22306.exe
  GOG_INSTALLER_SHA256: 48e31728ef2615f4e1ee3e34c901feec8ea428a474fc9c7386cc11018311a68d
  GOG_INPUT_REPO: agluszak/wiz8-ci-inputs
  GOG_RELEASE_TAG: gog-22306
  GOG_CACHE_VERSION: v1-aes256cbc-pbkdf2-200000
  GHIDRA_INSTALL_DIR: /tmp/wiz8-ci/ghidra_12.1.4_PUBLIC
  WIZ8_INPUT_DIR: /tmp/wiz8-inputs
  WIZ8_WORK_DIR: /tmp/wiz8-work
  WIZ8_GHIDRA_PROJECT_DIR: /tmp/wiz8-ghidra-project
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}

jobs:
  scope:
    name: Select CI lanes
    runs-on: ubuntu-24.04
    outputs:
      public: ${{ steps.scope.outputs.public }}
      analysis: ${{ steps.scope.outputs.analysis }}
      wiz8_compare: ${{ steps.scope.outputs.wiz8_compare }}
      surrender: ${{ steps.scope.outputs.surrender }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Classify changed paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' public=true analysis=true wiz8_compare=true surrender=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=2 origin \
              "+${{ github.event.pull_request.base.sha }}:refs/remotes/origin/$GITHUB_BASE_REF" \
              "+${{ github.event.pull_request.head.sha }}:refs/remotes/origin/pr-head"
            base="refs/remotes/origin/$GITHUB_BASE_REF"
            head="refs/remotes/origin/pr-head"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.before }}"
            base="${{ github.event.before }}"
            head="$GITHUB_SHA"
          else
            printf '%s\n' public=true analysis=true wiz8_compare=true surrender=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$RUNNER_TEMP/changed-files.txt"
          git diff --name-only "$base" "$head" > "$changed"
          echo "Changed paths:"
          cat "$changed"
          python3 .github/scripts/classify-ci-changes.py < "$changed" | tee -a "$GITHUB_OUTPUT"

  toolchain:
    name: Prepare VC6 images
    needs: scope
    if: >-
      needs.scope.outputs.public == 'true' ||
      needs.scope.outputs.analysis == 'true' ||
      needs.scope.outputs.wiz8_compare == 'true' ||
      needs.scope.outputs.surrender == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check VC6 analysis image cache
        id: analysis-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wiz8-vc6-analysis-image
          key: vc6-analysis-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/build-inputs.yml', 'tools/wiz8decomp/build_inputs.py') }}
          lookup-only: true

      - name: Check VC6 product image cache
        id: product-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wiz8-vc6-product-image
          key: vc6-product-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/build-inputs.yml', 'tools/wiz8decomp/build_inputs.py') }}
          lookup-only: true

      - name: Set up Python for VC6 cache miss
        if: steps.analysis-cache.outputs.cache-hit != 'true' || steps.product-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv for VC6 cache miss
        if: steps.analysis-cache.outputs.cache-hit != 'true' || steps.product-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Python dependencies for VC6 cache miss
        if: steps.analysis-cache.outputs.cache-hit != 'true' || steps.product-cache.outputs.cache-hit != 'true'
        run: uv sync --frozen

      - name: Build pinned VC6 images
        if: steps.analysis-cache.outputs.cache-hit != 'true' || steps.product-cache.outputs.cache-hit != 'true'
        run: uv run wiz8 toolchain build vc6-sp5

      - name: Archive VC6 analysis image
        if: steps.analysis-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/wiz8-vc6-analysis-image"
          docker save wizardry8-msvc600:sp5 | gzip -1 > "$RUNNER_TEMP/wiz8-vc6-analysis-image/vc6-analysis.tar.gz"

      - name: Save VC6 analysis image cache
        if: steps.analysis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/wiz8-vc6-analysis-image
          key: vc6-analysis-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/build-inputs.yml', 'tools/wiz8decomp/build_inputs.py') }}

      - name: Archive VC6 product image
        if: steps.product-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/wiz8-vc6-product-image"
          docker save wizardry8-msvc600:sp5-product | gzip -1 > "$RUNNER_TEMP/wiz8-vc6-product-image/vc6-product.tar.gz"

      - name: Save VC6 product image cache
        if: steps.product-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/wiz8-vc6-product-image
          key: vc6-product-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/build-inputs.yml', 'tools/wiz8decomp/build_inputs.py') }}

  repository:
    name: Repository checks
    needs: [scope, toolchain]
    if: needs.scope.outputs.public == 'true' && needs.toolchain.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Fetch PR comparison baseline
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=2 origin \
            "+${{ github.event.pull_request.base.sha }}:refs/remotes/origin/$GITHUB_BASE_REF" \
            "+${{ github.event.pull_request.head.sha }}:refs/remotes/origin/pr-head"
      - name: Fetch push comparison baseline
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.before }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Verify PR base ancestry and marker preservation
        if: github.event_name == 'pull_request'
        run: |
          pr_head="refs/remotes/origin/pr-head"
          for _ in 1 2 3 4 5; do
            if git merge-base "$pr_head" "origin/$GITHUB_BASE_REF" >/dev/null 2>&1; then break; fi
            git fetch --no-tags --deepen=256 origin \
              "+${{ github.event.pull_request.base.sha }}:refs/remotes/origin/$GITHUB_BASE_REF" \
              "+${{ github.event.pull_request.head.sha }}:$pr_head"
          done
          uv run wiz8 report merge-preservation --base "origin/$GITHUB_BASE_REF" --head "$pr_head"
      - name: Install host analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm
          command -v llvm-undname
      - name: Restore public library source cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WIZ8_WORK_DIR }}/sources
          key: wiz8-sources-v1-${{ hashFiles('config/build-inputs.yml', 'tools/wiz8decomp/build_inputs.py') }}
      - name: Fetch public library sources
        run: >-
          uv run python -c "from wiz8decomp.build_inputs import fetch_sources;
          from wiz8decomp.config import load_settings;
          fetch_sources(load_settings())"
      - name: Load VC6 analysis image
        uses: ./.github/actions/load-vc6-image
      - name: Restore compiler-backed analysis cache
        uses: actions/cache@v4
        with:
          path: |
            build/clang
            build/reccmp-source
            build/source-index.json
          key: analysis-state-v1-${{ runner.os }}-${{ hashFiles('uv.lock', 'docker/msvc600/**', 'config/build-inputs.yml') }}-${{ github.sha }}
          restore-keys: |
            analysis-state-v1-${{ runner.os }}-${{ hashFiles('uv.lock', 'docker/msvc600/**', 'config/build-inputs.yml') }}-
      - name: Restore public library source cache
        uses: actions/cache@v4
        with:
          path: ${{ env.WIZ8_WORK_DIR }}/sources
          key: wiz8-sources-v1-${{ hashFiles('config/build-inputs.yml', 'tools/wiz8decomp/build_inputs.py') }}
      - name: Prepare public library sources
        run: uv run wiz8 prepare --sources-only
      - name: Run repository checks and Python tests
        run: uv run wiz8 check
      - name: Run clang-cl and clang-tidy lints
        run: uv run wiz8 lint

  analysis:
    name: Ghidra integration
    needs: [scope]
    if: needs.scope.outputs.analysis == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install pinned Ghidra
        uses: ./.github/actions/install-ghidra
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Restore reviewed Ghidra checkpoint
        run: uv run wiz8 ghidra restore
      - name: Run Ghidra enrichment integration tests
        run: uv run pytest -q tests/ghidra

  wiz8:
    name: WIZ8 comparison
    needs: [scope, toolchain]
    if: >-
      needs.scope.outputs.wiz8_compare == 'true' &&
      needs.toolchain.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      reccmp-status: ${{ steps.wiz8-status.outputs.status }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install WIZ8 comparison host tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            innoextract llvm wine wine32:i386 wine64
          mkdir -p "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR"
          command -v llvm-undname
          command -v wine
      # reccmp comparison consumes the compiler-backed source index, which
      # needs the analysis image's Clang/LLVM tooling.
      - name: Load VC6 analysis image
        uses: ./.github/actions/load-vc6-image
      - name: Restore compiler-backed analysis cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/clang
            build/reccmp-source
            build/source-index.json
          key: analysis-state-v1-${{ runner.os }}-${{ hashFiles('uv.lock', 'docker/msvc600/**', 'config/build-inputs.yml') }}-${{ github.sha }}
          restore-keys: |
            analysis-state-v1-${{ runner.os }}-${{ hashFiles('uv.lock', 'docker/msvc600/**', 'config/build-inputs.yml') }}-
      - name: Restore incremental WIZ8 comparison build
        uses: actions/cache@v4
        with:
          path: build/decomp
          key: product-wiz8-comparison-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/build-inputs.yml') }}-${{ github.sha }}
          restore-keys: |
            product-wiz8-comparison-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/build-inputs.yml') }}-
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Prepare minimal WIZ8 comparison inputs
        uses: ./.github/actions/prepare-comparison-inputs
        with:
          inputs-token: ${{ secrets.WIZ8_INPUTS_TOKEN }}
          cache-key: ${{ secrets.WIZ8_CACHE_KEY }}
      - name: Build WIZ8 comparison products
        run: uv run wiz8 build match
      - name: Index WIZ8 source
        run: uv run wiz8 analyze source-index
      # Pull requests compare changed functions; main runs the licensed
      # comparison tests. Both need Ghidra and the reccmp analysis.
      - name: Install pinned Ghidra
        uses: ./.github/actions/install-ghidra
      - name: Restore reviewed WIZ8 checkpoint
        run: uv run wiz8 ghidra restore
      - name: Restore reccmp Ghidra analysis
        id: wiz8-analysis-cache
        uses: actions/cache/restore@v4
        with:
          path: build/reccmp-ghidra
          key: reccmp-ghidra-v1-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            reccmp-ghidra-v1-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
      - name: Compare changed WIZ8 functions
        id: wiz8-compare
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA" "$base_sha"
          merge_base=""
          for _ in 1 2 3 4 5; do
            merge_base="$(git merge-base HEAD "$base_sha" 2>/dev/null || true)"
            [[ -n "$merge_base" ]] && break
            git fetch --no-tags --deepen=256 origin "$GITHUB_SHA" "$base_sha"
          done
          if [[ -z "$merge_base" ]]; then
            echo "Could not resolve PR merge base" >&2
            exit 1
          fi
          if ! git diff --name-only --diff-filter=d "$merge_base" HEAD | \
            grep -Eq '^(src/wiz8/|src/sgp/|include/wiz8/|include/surrender/).*\.(c|cc|cpp|cxx|h|hpp|hxx)$'; then
            echo 'No changed WIZ8 C/C++ source; skipping function comparison.'
            exit 0
          fi
          # Differences are review material; the step fails only when a
          # comparison did not complete or a changed function is unpaired.
          uv run wiz8 compare --changed --since "$merge_base" --sxs
      - name: Package WIZ8 comparison report
        if: github.event_name == 'pull_request' && always()
        run: |
          if [[ -d build/reports/compare/wiz8 ]]; then
            tar -czf build/reports/compare/wiz8-report.tar.gz -C build/reports/compare/wiz8 .
          fi
      - name: Upload WIZ8 comparison report
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: wiz8-comparison-report
          # Ghidriff names side-by-side files after C++ symbols, which can
          # contain colons rejected by the artifact service.
          path: build/reports/compare/wiz8-report.tar.gz
          if-no-files-found: ignore
      - name: Capture selected WIZ8 comparison
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -uo pipefail
          quality_status=0
          latest="build/reports/compare/wiz8/latest"
          # Source PRs already produced the selected report above. Only
          # tooling-only changes without a source selection need a full run.
          if [[ ! -f "$latest/summary.json" ]]; then
            uv run wiz8 compare --all-source || quality_status=$?
          fi
          test -f "$latest/summary.json"
          cp "$latest/summary.json" "$RUNNER_TEMP/wiz8-head-summary.json"
          cp "$latest/json/WIZ8.ghidriff.json" "$RUNNER_TEMP/wiz8-head-ghidriff.json"
          if [[ -f "$latest/direct-calls.json" ]]; then
            cp "$latest/direct-calls.json" "$RUNNER_TEMP/wiz8-head-direct-calls.json"
          fi
          if (( quality_status != 0 )); then
            echo "::notice::target-wide WIZ8 comparison contains unpaired/incomplete functions"
          fi
      - name: Run WIZ8 checks
        id: wiz8-checks
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          status_json="$RUNNER_TEMP/wiz8-head-status.json"
          comparison_status=0

          if uv run wiz8 report status > "$status_json"; then
            jq -e '.targets.WIZ8.state == "comparison"' "$status_json" >/dev/null || comparison_status=1
          else
            comparison_status=1
          fi
          vtable_status=0
          datacmp_status=0
          uv run wiz8 vtable || vtable_status=$?
          uv run wiz8 datacmp > "$RUNNER_TEMP/wiz8-head-datacmp.json" || datacmp_status=$?
          cat "$RUNNER_TEMP/wiz8-head-datacmp.json"
          if (( vtable_status != 0 || datacmp_status != 0 )); then
            echo "::warning::specialized WIZ8 comparison debt: vtable=$vtable_status datacmp=$datacmp_status"
          fi

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            uv run pytest -q tests/licensed || comparison_status=1
          fi

          if [[ "${{ steps.wiz8-compare.outcome }}" == "failure" ]]; then
            comparison_status=1
          fi

          echo "comparison_status=$comparison_status"
          exit "$comparison_status"

      - name: Upload WIZ8 comparison logs
        if: steps.wiz8-checks.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: wiz8-comparison-logs
          path: build/logs/
          if-no-files-found: warn
      - name: Fail if WIZ8 checks failed
        if: steps.wiz8-checks.outcome == 'failure'
        run: exit 1
      - name: Compare WIZ8 merge base
        if: github.event_name == 'pull_request'
        run: |
          bash .github/scripts/compare-reccmp-base.sh \
            WIZ8 wiz8 match \
            "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA" wiz8
      # Preserve completed analysis even if downstream PR-summary reporting fails.
      - name: Save completed WIZ8 analysis
        if: steps.wiz8-analysis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/reccmp-ghidra
          key: ${{ steps.wiz8-analysis-cache.outputs.cache-primary-key }}
      - name: Summarize WIZ8 PR comparison
        id: wiz8-status
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --target WIZ8
            --head-status "$RUNNER_TEMP/wiz8-head-status.json"
            --base-status "$RUNNER_TEMP/wiz8-base-status.json"
          )
          args+=(
            --head-summary "$RUNNER_TEMP/wiz8-head-summary.json"
            --base-summary "$RUNNER_TEMP/wiz8-base-summary.json"
            --head-ghidriff "$RUNNER_TEMP/wiz8-head-ghidriff.json"
            --base-ghidriff "$RUNNER_TEMP/wiz8-base-ghidriff.json"
            --head-datacmp "$RUNNER_TEMP/wiz8-head-datacmp.json"
            --base-datacmp "$RUNNER_TEMP/wiz8-base-datacmp.json"
          )
          # Compare allocator families on the inline-normalized call view.
          if [[ -f "$RUNNER_TEMP/wiz8-head-direct-calls.json" && -f "$RUNNER_TEMP/wiz8-base-direct-calls.json" ]]; then
            args+=(
              --head-direct-calls "$RUNNER_TEMP/wiz8-head-direct-calls.json"
              --base-direct-calls "$RUNNER_TEMP/wiz8-base-direct-calls.json"
            )
          fi
          # Group regressions by the changed headers their files include directly.
          if merge_base="$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}" 2>/dev/null)"; then
            args+=(--since "$merge_base")
          fi
          uv run wiz8 report pr-comparison "${args[@]}" > "$RUNNER_TEMP/wiz8-pr-status.json"
          printf 'status=%s\n' "$(jq -c . "$RUNNER_TEMP/wiz8-pr-status.json")" >> "$GITHUB_OUTPUT"
      - name: Remove plaintext licensed WIZ8 inputs
        if: always()
        run: |
          wineserver -k || true
          rm -rf "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR" "$RUNNER_TEMP/wiz8-gog-download" config/local-inputs.yml

  surrender:
    name: SURRENDER comparison
    needs: [scope, toolchain]
    if: >-
      needs.scope.outputs.surrender == 'true' &&
      needs.toolchain.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      reccmp-status: ${{ steps.surrender-pr-status.outputs.status }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install SURRENDER comparison host tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            innoextract llvm wine wine32:i386 wine64
          mkdir -p "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR"
          command -v llvm-undname
          command -v wine
          command -v winepath
      - name: Load VC6 analysis image
        uses: ./.github/actions/load-vc6-image
      - name: Restore compiler-backed analysis cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/clang
            build/reccmp-source
            build/source-index.json
          key: analysis-state-v1-${{ runner.os }}-${{ hashFiles('uv.lock', 'docker/msvc600/**', 'config/build-inputs.yml') }}-${{ github.sha }}
          restore-keys: |
            analysis-state-v1-${{ runner.os }}-${{ hashFiles('uv.lock', 'docker/msvc600/**', 'config/build-inputs.yml') }}-
      - name: Restore incremental SURRENDER product build
        uses: actions/cache@v4
        with:
          path: build/decomp
          key: product-surrender-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/build-inputs.yml') }}-${{ github.sha }}
          restore-keys: |
            product-surrender-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/build-inputs.yml') }}-
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Prepare minimal SURRENDER comparison inputs
        uses: ./.github/actions/prepare-comparison-inputs
        with:
          inputs-token: ${{ secrets.WIZ8_INPUTS_TOKEN }}
          cache-key: ${{ secrets.WIZ8_CACHE_KEY }}
      - name: Build SURRENDER comparison product
        run: uv run wiz8 build SURRENDER
      - name: Index SURRENDER source
        run: uv run wiz8 analyze source-index
      - name: Install pinned Ghidra
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/install-ghidra
      - name: Restore reviewed SURRENDER checkpoint
        if: github.event_name == 'pull_request'
        run: uv run wiz8 ghidra restore --program sr.dll
      - name: Restore reccmp Ghidra analysis
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: build/reccmp-ghidra
          key: reccmp-ghidra-surrender-v1-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            reccmp-ghidra-surrender-v1-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
      - name: Compare changed SURRENDER functions
        if: github.event_name == 'pull_request'
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA" "$base_sha"
          merge_base=""
          for _ in 1 2 3 4 5; do
            merge_base="$(git merge-base HEAD "$base_sha" 2>/dev/null || true)"
            [[ -n "$merge_base" ]] && break
            git fetch --no-tags --deepen=256 origin "$GITHUB_SHA" "$base_sha"
          done
          if [[ -z "$merge_base" ]]; then
            echo "Could not resolve PR merge base" >&2
            exit 1
          fi
          if ! git diff --name-only --diff-filter=d "$merge_base" HEAD | \
            grep -Eq '^(src/surrender/|include/surrender/).*\.(c|cc|cpp|cxx|h|hpp|hxx)$'; then
            echo 'No changed SURRENDER C/C++ source; skipping function comparison.'
            exit 0
          fi
          uv run wiz8 compare --changed --since "$merge_base" \
            --program sr.dll --sxs
      - name: Package SURRENDER comparison report
        if: github.event_name == 'pull_request' && always()
        run: |
          if [[ -d build/reports/compare/surrender ]]; then
            tar -czf build/reports/compare/surrender-report.tar.gz -C build/reports/compare/surrender .
          fi
      - name: Upload SURRENDER comparison report
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: surrender-comparison-report
          path: build/reports/compare/surrender-report.tar.gz
          if-no-files-found: ignore
      - name: Capture selected SURRENDER comparison
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -uo pipefail
          quality_status=0
          latest="build/reports/compare/surrender/latest"
          if [[ ! -f "$latest/summary.json" ]]; then
            uv run wiz8 compare --all-source --program sr.dll || quality_status=$?
          fi
          test -f "$latest/summary.json"
          cp "$latest/summary.json" "$RUNNER_TEMP/surrender-head-summary.json"
          cp "$latest/json/SURRENDER.ghidriff.json" "$RUNNER_TEMP/surrender-head-ghidriff.json"
          if [[ -f "$latest/direct-calls.json" ]]; then
            cp "$latest/direct-calls.json" "$RUNNER_TEMP/surrender-head-direct-calls.json"
          fi
          if (( quality_status != 0 )); then
            echo "::notice::target-wide SURRENDER comparison contains unpaired/incomplete functions"
          fi
      - name: Verify SURRENDER catalog
        id: surrender-status
        run: |
          status_json="$RUNNER_TEMP/surrender-head-status.json"
          uv run wiz8 report status > "$status_json"
          # error_count covers live reccmp diagnostics; unpaired_line_refs covers
          # the same "Failed to find function symbol" failures when the prepared
          # catalog cache serves the engine without re-emitting log records.
          jq -e '
            .targets.SURRENDER.state == "comparison"
            and .targets.SURRENDER.diagnostics.error_count == 0
            and .targets.SURRENDER.pairing.unpaired_line_refs == 0
          ' "$status_json" >/dev/null
          jq '.targets.SURRENDER' "$status_json"
          datacmp_status=0
          uv run wiz8 datacmp --program sr.dll > "$RUNNER_TEMP/surrender-head-datacmp.json" || datacmp_status=$?
          cat "$RUNNER_TEMP/surrender-head-datacmp.json"
          if (( datacmp_status != 0 )); then
            echo "::warning::SURRENDER datacmp reports differences"
          fi
      - name: Compare SURRENDER merge base
        if: github.event_name == 'pull_request'
        run: |
          bash .github/scripts/compare-reccmp-base.sh \
            SURRENDER sr.dll SURRENDER \
            "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA" surrender
      - name: Summarize SURRENDER PR comparison
        id: surrender-pr-status
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --target SURRENDER
            --head-status "$RUNNER_TEMP/surrender-head-status.json"
            --base-status "$RUNNER_TEMP/surrender-base-status.json"
          )
          args+=(
            --head-summary "$RUNNER_TEMP/surrender-head-summary.json"
            --base-summary "$RUNNER_TEMP/surrender-base-summary.json"
            --head-ghidriff "$RUNNER_TEMP/surrender-head-ghidriff.json"
            --base-ghidriff "$RUNNER_TEMP/surrender-base-ghidriff.json"
            --head-datacmp "$RUNNER_TEMP/surrender-head-datacmp.json"
            --base-datacmp "$RUNNER_TEMP/surrender-base-datacmp.json"
          )
          # Compare allocator families on the inline-normalized call view.
          if [[ -f "$RUNNER_TEMP/surrender-head-direct-calls.json" && -f "$RUNNER_TEMP/surrender-base-direct-calls.json" ]]; then
            args+=(
              --head-direct-calls "$RUNNER_TEMP/surrender-head-direct-calls.json"
              --base-direct-calls "$RUNNER_TEMP/surrender-base-direct-calls.json"
            )
          fi
          # Group regressions by the changed headers their files include directly.
          if merge_base="$(git merge-base HEAD "${{ github.event.pull_request.base.sha }}" 2>/dev/null)"; then
            args+=(--since "$merge_base")
          fi
          uv run wiz8 report pr-comparison "${args[@]}" > "$RUNNER_TEMP/surrender-pr-status.json"
          printf 'status=%s\n' "$(jq -c . "$RUNNER_TEMP/surrender-pr-status.json")" >> "$GITHUB_OUTPUT"
      - name: Remove plaintext licensed SURRENDER inputs
        if: always()
        run: rm -rf "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR" "$RUNNER_TEMP/wiz8-gog-download" config/local-inputs.yml

  ci:
    name: Public checks, lints, and tests
    needs: [scope, toolchain, repository, analysis, wiz8, surrender]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected lane to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          TOOLCHAIN_RESULT: ${{ needs.toolchain.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          WIZ8_RESULT: ${{ needs.wiz8.result }}
          SURRENDER_RESULT: ${{ needs.surrender.result }}
        run: |
          set -euo pipefail
          for result in "$SCOPE_RESULT" "$TOOLCHAIN_RESULT" "$REPOSITORY_RESULT" "$ANALYSIS_RESULT" "$WIZ8_RESULT" "$SURRENDER_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "selected CI lane failed or was cancelled: $result" >&2; exit 1 ;;
            esac
          done

  comment-reccmp-status:
    name: Comment reccmp status
    needs: [wiz8, surrender]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (needs.wiz8.result == 'success' && needs.wiz8.outputs.reccmp-status != '') ||
        (needs.surrender.result == 'success' && needs.surrender.outputs.reccmp-status != '')
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WIZ8_STATUS: ${{ needs.wiz8.outputs.reccmp-status }}
          SURRENDER_STATUS: ${{ needs.surrender.outputs.reccmp-status }}
        shell: bash
        run: |
          set -euo pipefail
          comment="$RUNNER_TEMP/reccmp-status.md"
          python3 .github/scripts/render-reccmp-comment.py > "$comment"

          marker='<!-- wiz8-reccmp-status -->'
          payload="$RUNNER_TEMP/reccmp-status-comment.json"
          comment_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1
          )"
          jq -Rs '{body: .}' < "$comment" > "$payload"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --input "$payload" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$payload" >/dev/null
          fi
