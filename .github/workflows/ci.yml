name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GHIDRA_ARCHIVE: ghidra_12.1.3_PUBLIC_20260817.zip
  GHIDRA_SHA256: 93a5d11a9ad510622acaaf908c556a7b9b764d338e78a7567f3689bf5081fd54

jobs:
  ci:
    name: Public checks, lints, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GHIDRA_INSTALL_DIR: /tmp/wiz8-ci/ghidra_12.1.3_PUBLIC
      WIZ8_INPUT_DIR: /tmp/wiz8-inputs
      WIZ8_WORK_DIR: /tmp/wiz8-work
      WIZ8_GHIDRA_PROJECT_DIR: /tmp/wiz8-ghidra-project
      WIZ8_RUNTIME_DISPLAY: virtual
      GITHUB_EVENT_BEFORE: ${{ github.event.before }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Push lint selects against event.before / HEAD^; keep one parent as
          # a fallback when event.before is unavailable (e.g. force-push zero).
          fetch-depth: 2

      - name: Fetch PR comparison baseline
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"

      - name: Fetch push comparison baseline
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        run: |
          # fetch-depth: 2 only guarantees HEAD^ for a single-commit tip; a
          # multi-commit push needs the explicit before SHA for changed_files().
          git fetch --no-tags --depth=1 origin "${{ github.event.before }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install host tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cabextract \
            innoextract \
            llvm \
            p7zip-full \
            unshield \
            unzip \
            wine \
            wine32:i386 \
            wine64 \
            xvfb
          mkdir -p "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR"
          # Docker creates missing bind-mount source paths as root. Keep the
          # empty placeholders runner-owned; public CI does not materialize
          # licensed game inputs.
          mkdir -p \
            "$WIZ8_WORK_DIR/fid/sources/unpacked/zlib-1.0.4/zlib-1.0.4" \
            "$WIZ8_WORK_DIR/fid/sources/unpacked/ijg-jpeg-6/jpeg-6" \
            "$WIZ8_WORK_DIR/fid/sources/unpacked/infozip-unzip-5.4"
          command -v llvm-undname
          command -v wine

      - name: Install pinned Ghidra
        run: |
          archive="$RUNNER_TEMP/$GHIDRA_ARCHIVE"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.3_build/$GHIDRA_ARCHIVE"
          echo "$GHIDRA_SHA256  $archive" | sha256sum --check -
          mkdir -p "$(dirname "$GHIDRA_INSTALL_DIR")"
          unzip -q "$archive" -d "$(dirname "$GHIDRA_INSTALL_DIR")"
          test -x "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Validate CI environment
        run: uv run wiz8 doctor

      - name: Build pinned VC6 analysis image
        run: uv run wiz8 toolchain build vc6-sp5

      - name: Run repository checks and Python tests
        run: uv run wiz8 check

      - name: Run clang-cl and clang-tidy lints
        run: uv run wiz8 lint

      - name: Run recovery lifecycle self-test
        run: uv run wiz8 recover self-test

      - name: Restore reviewed Ghidra checkpoint
        run: uv run wiz8 ghidra restore

      - name: Run Ghidra enrichment integration tests
        run: uv run pytest -q tests/ghidra
