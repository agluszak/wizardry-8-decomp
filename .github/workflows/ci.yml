name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GHIDRA_ARCHIVE: ghidra_12.1.2_PUBLIC_20260605.zip
  GHIDRA_SHA256: b62e81a0390618466c019c60d8c2f796ced2509c4c1aea4a37644a77272cf99d
  GOG_INSTALLER_NAME: setup_wizardry_8_2001_12_23_(22306).exe
  GOG_INSTALLER_SHA256: 48e31728ef2615f4e1ee3e34c901feec8ea428a474fc9c7386cc11018311a68d

jobs:
  ci:
    name: Public checks, lints, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      reccmp-comment: ${{ steps.reccmp-status.outputs.comment }}
    env:
      GHIDRA_INSTALL_DIR: /tmp/wiz8-ci/ghidra_12.1.2_PUBLIC
      WIZ8_INPUT_DIR: /tmp/wiz8-inputs
      WIZ8_WORK_DIR: /tmp/wiz8-work
      WIZ8_GHIDRA_PROJECT_DIR: /tmp/wiz8-ghidra-project
      WIZ8_RUNTIME_DISPLAY: virtual
      TRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner }}
      LICENSED_INPUTS: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch PR comparison baseline
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install host tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cabextract \
            innoextract \
            llvm \
            p7zip-full \
            unshield \
            unzip \
            wine \
            wine32:i386 \
            wine64 \
            xvfb
          mkdir -p "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR"
          command -v llvm-undname
          command -v wine

      - name: Install pinned Ghidra
        run: |
          archive="$RUNNER_TEMP/$GHIDRA_ARCHIVE"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/$GHIDRA_ARCHIVE"
          echo "$GHIDRA_SHA256  $archive" | sha256sum --check -
          mkdir -p "$(dirname "$GHIDRA_INSTALL_DIR")"
          unzip -q "$archive" -d "$(dirname "$GHIDRA_INSTALL_DIR")"
          test -x "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Validate CI environment
        run: uv run wiz8 doctor

      - name: Build pinned VC6 analysis image
        run: uv run wiz8 toolchain build vc6-sp5

      - name: Run repository checks and Python tests
        run: uv run wiz8 check

      - name: Run clang-cl and clang-tidy lints
        run: uv run wiz8 lint

      - name: Run recovery lifecycle self-test
        run: uv run wiz8 recover self-test

      - name: Restore reviewed Ghidra checkpoint
        run: uv run wiz8 ghidra restore

      - name: Download and verify licensed GOG input
        if: env.LICENSED_INPUTS == 'true'
        env:
          WIZ8_GOG_URL: ${{ secrets.WIZ8_GOG_URL }}
        run: |
          if [ -z "$WIZ8_GOG_URL" ]; then
            echo "WIZ8_GOG_URL repository secret is required for licensed CI" >&2
            exit 1
          fi
          installer="$WIZ8_INPUT_DIR/$GOG_INSTALLER_NAME"
          uvx --from gdown==5.2.1 gdown --fuzzy "$WIZ8_GOG_URL" -O "$installer" --quiet
          echo "$GOG_INSTALLER_SHA256  $installer" | sha256sum --check -
          cat > config/local-inputs.yml <<EOF
          schema: wiz8.local-inputs
          inputs:
            gog-media: $GOG_INSTALLER_NAME
          EOF

      - name: Prepare licensed corpus
        if: env.LICENSED_INPUTS == 'true'
        run: uv run wiz8 prepare

      - name: Build WIZ8 comparison product
        if: env.LICENSED_INPUTS == 'true'
        run: uv run wiz8 build match

      - name: Generate reccmp PR status
        id: reccmp-status
        if: env.TRUSTED_PR == 'true'
        run: |
          status_json="$RUNNER_TEMP/reccmp-status.json"
          comment="$RUNNER_TEMP/reccmp-status.md"
          uv run wiz8 report status > "$status_json"
          jq -r '
            def pct:
              if . == null then "n/a"
              else (((. * 10000 | round) / 100) | tostring) + "%"
              end;
            .totals as $t |
            $t.known_original_scope as $k |
            (
              [
                "<!-- wiz8-reccmp-status -->",
                "### reccmp status",
                "",
                "| Metric | Value |",
                "| --- | ---: |",
                "| Source functions | \($t.source_functions) |",
                "| Source coverage (known scope) | \($k.source_functions) / \($k.original_functions) (\($k.source_coverage | pct)) |",
                "| Effective progress (known scope) | \($k.progress | pct) |",
                "| Paired source functions | \($t.paired) |",
                "| Exact | \($t.exact) |",
                "| Effective | \($t.effective) |",
                "| Mismatch | \($t.mismatch) |",
                "| Inconclusive | \($t.inconclusive) |",
                "| Unpaired | \($t.unpaired) |",
                "| Ignored | \($t.ignored) |",
                "| Pair accuracy | \($t.accuracy | pct) |",
                "",
                "<details><summary>Per target</summary>",
                "",
                "| Target | Source | Coverage | Progress | Exact | Effective | Mismatch | Inconclusive | Unpaired | Accuracy |",
                "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
              ]
              + (
                  .targets
                  | to_entries
                  | map(select(.value.state == "comparison"))
                  | map(
                      .value as $v
                      | "| `\(.key)` | \($v.source.functions // 0) | \($v.source_coverage | pct) | \($v.progress | pct) | \($v.comparison.exact) | \($v.comparison.effective) | \($v.comparison.mismatch) | \($v.comparison.inconclusive) | \($v.comparison.unpaired) | \($v.comparison.accuracy | pct) |"
                    )
                )
              + ["", "</details>"]
            ) | join("\n")
          ' "$status_json" > "$comment"
          printf '\n\n_Updated from CI merge result `%s`._\n' "${GITHUB_SHA:0:12}" >> "$comment"
          {
            echo 'comment<<__RECCMP_STATUS__'
            cat "$comment"
            echo '__RECCMP_STATUS__'
          } >> "$GITHUB_OUTPUT"

      - name: Audit specialized reccmp comparisons
        if: env.LICENSED_INPUTS == 'true'
        run: |
          uv run wiz8 vtable
          uv run wiz8 datacmp

      - name: Run licensed comparison tests
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: uv run pytest -q tests/licensed

      - name: Run full runtime suite
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: uv run wiz8 runtime-test --build --check-order

      - name: Remove licensed inputs and derived trees
        if: always() && env.LICENSED_INPUTS == 'true'
        run: |
          wineserver -k || true
          rm -rf "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR" config/local-inputs.yml

  comment-reccmp-status:
    name: Comment reccmp status
    needs: ci
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner && needs.ci.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMENT_BODY: ${{ needs.ci.outputs.reccmp-comment }}
        run: |
          test -n "$COMMENT_BODY"
          marker='<!-- wiz8-reccmp-status -->'
          payload="$RUNNER_TEMP/reccmp-status-comment.json"
          comment_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" \
              | head -n1
          )"
          printf '%s' "$COMMENT_BODY" | jq -Rs '{body: .}' > "$payload"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --input "$payload" >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --input "$payload" >/dev/null
          fi
