name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      renderer:
        description: Runtime renderer experiment
        type: choice
        default: default
        options: [default, softpipe]
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GHIDRA_ARCHIVE: ghidra_12.1.4_PUBLIC_20260921.zip
  GHIDRA_SHA256: ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db
  GOG_INSTALLER_NAME: setup_wizardry_8_2001_12_23_(22306).exe
  GOG_RELEASE_ASSET_NAME: setup_wizardry_8_2001_12_23_.22306.exe
  GOG_INSTALLER_SHA256: 48e31728ef2615f4e1ee3e34c901feec8ea428a474fc9c7386cc11018311a68d
  GOG_INPUT_REPO: agluszak/wiz8-ci-inputs
  GOG_RELEASE_TAG: gog-22306
  GOG_CACHE_VERSION: v1-aes256cbc-pbkdf2-200000
  GHIDRA_INSTALL_DIR: /tmp/wiz8-ci/ghidra_12.1.4_PUBLIC
  WIZ8_INPUT_DIR: /tmp/wiz8-inputs
  WIZ8_WORK_DIR: /tmp/wiz8-work
  WIZ8_GHIDRA_PROJECT_DIR: /tmp/wiz8-ghidra-project
  WIZ8_RUNTIME_DISPLAY: virtual
  GITHUB_EVENT_BEFORE: ${{ github.event.before }}

jobs:
  scope:
    name: Select CI lanes
    runs-on: ubuntu-24.04
    outputs:
      public: ${{ steps.scope.outputs.public }}
      analysis: ${{ steps.scope.outputs.analysis }}
      wiz8_compare: ${{ steps.scope.outputs.wiz8_compare }}
      wiz8_runtime: ${{ steps.scope.outputs.wiz8_runtime }}
      surrender: ${{ steps.scope.outputs.surrender }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Classify changed paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            printf '%s\n' public=true analysis=true wiz8_compare=true wiz8_runtime=true surrender=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=2 origin \
              "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" \
              "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"
            base="refs/remotes/origin/$GITHUB_BASE_REF"
            head="refs/remotes/origin/pr-head"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.before }}"
            base="${{ github.event.before }}"
            head="$GITHUB_SHA"
          else
            printf '%s\n' public=true analysis=true wiz8_compare=true wiz8_runtime=true surrender=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$RUNNER_TEMP/changed-files.txt"
          git diff --name-only "$base" "$head" > "$changed"
          echo "Changed paths:"
          cat "$changed"
          python3 .github/scripts/classify-ci-changes.py < "$changed" | tee -a "$GITHUB_OUTPUT"

  toolchain:
    name: Prepare VC6 images
    needs: scope
    if: >-
      needs.scope.outputs.public == 'true' ||
      needs.scope.outputs.analysis == 'true' ||
      needs.scope.outputs.wiz8_compare == 'true' ||
      needs.scope.outputs.wiz8_runtime == 'true' ||
      needs.scope.outputs.surrender == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check VC6 analysis image cache
        id: analysis-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wiz8-vc6-analysis-image
          key: vc6-analysis-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/static-libraries.yml', 'tools/wiz8decomp/ghidra/fid_seeds.py') }}
          lookup-only: true

      - name: Check VC6 product image cache
        id: product-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/wiz8-vc6-product-image
          key: vc6-product-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/static-libraries.yml', 'tools/wiz8decomp/ghidra/fid_seeds.py') }}
          lookup-only: true

      - name: Set up Python for VC6 cache miss
        if: steps.analysis-cache.outputs.cache-hit != 'true' || steps.product-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv for VC6 cache miss
        if: steps.analysis-cache.outputs.cache-hit != 'true' || steps.product-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true

      - name: Install Python dependencies for VC6 cache miss
        if: steps.analysis-cache.outputs.cache-hit != 'true' || steps.product-cache.outputs.cache-hit != 'true'
        run: uv sync --frozen

      - name: Build pinned VC6 images
        if: steps.analysis-cache.outputs.cache-hit != 'true' || steps.product-cache.outputs.cache-hit != 'true'
        run: uv run wiz8 toolchain build vc6-sp5

      - name: Archive VC6 analysis image
        if: steps.analysis-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/wiz8-vc6-analysis-image"
          docker save wizardry8-msvc600:sp5 | gzip -1 > "$RUNNER_TEMP/wiz8-vc6-analysis-image/vc6-analysis.tar.gz"

      - name: Save VC6 analysis image cache
        if: steps.analysis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/wiz8-vc6-analysis-image
          key: vc6-analysis-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/static-libraries.yml', 'tools/wiz8decomp/ghidra/fid_seeds.py') }}

      - name: Archive VC6 product image
        if: steps.product-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/wiz8-vc6-product-image"
          docker save wizardry8-msvc600:sp5-product | gzip -1 > "$RUNNER_TEMP/wiz8-vc6-product-image/vc6-product.tar.gz"

      - name: Save VC6 product image cache
        if: steps.product-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/wiz8-vc6-product-image
          key: vc6-product-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/static-libraries.yml', 'tools/wiz8decomp/ghidra/fid_seeds.py') }}

  repository:
    name: Repository checks
    needs: [scope, toolchain]
    if: needs.scope.outputs.public == 'true' && needs.toolchain.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Fetch PR comparison baseline
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=2 origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" \
            "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"
      - name: Fetch push comparison baseline
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: git fetch --no-tags --depth=1 origin "${{ github.event.before }}"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Verify PR base ancestry and marker preservation
        if: github.event_name == 'pull_request'
        run: |
          pr_head="refs/remotes/origin/pr-head"
          for _ in 1 2 3 4 5; do
            if git merge-base "$pr_head" "origin/$GITHUB_BASE_REF" >/dev/null 2>&1; then break; fi
            git fetch --no-tags --deepen=256 origin \
              "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF" \
              "+refs/pull/${{ github.event.pull_request.number }}/head:$pr_head"
          done
          uv run wiz8 report merge-preservation --base "origin/$GITHUB_BASE_REF" --head "$pr_head" \
            --allow 'WIZ8:GLOBAL:0x006595EC:loss=viewport top is a field of the contiguous W8ViewportRect global at 0x006595E8' \
            --allow 'WIZ8:GLOBAL:0x006595F0:loss=viewport right is a field of the contiguous W8ViewportRect global at 0x006595E8' \
            --allow 'WIZ8:GLOBAL:0x006595F4:loss=viewport bottom is a field of the contiguous W8ViewportRect global at 0x006595E8' \
            --allow 'WIZ8:GLOBAL:0x0069BF44:loss=second pointer slot is element 1 of the indexed W8TextControl array at 0x0069BF40'
      - name: Install host analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm
          mkdir -p \
            "$WIZ8_WORK_DIR/fid/sources/unpacked/zlib-1.0.4/zlib-1.0.4" \
            "$WIZ8_WORK_DIR/fid/sources/unpacked/ijg-jpeg-6/jpeg-6" \
            "$WIZ8_WORK_DIR/fid/sources/unpacked/infozip-unzip-5.4"
          command -v llvm-undname
      - name: Load VC6 analysis image
        uses: ./.github/actions/load-vc6-image
      - name: Restore compiler-backed analysis cache
        uses: actions/cache@v4
        with:
          path: |
            build/clang
            build/reccmp-source
            build/source-index.json
          key: analysis-state-v1-${{ runner.os }}-${{ hashFiles('uv.lock', 'docker/msvc600/**', 'config/static-libraries.yml') }}-${{ github.sha }}
          restore-keys: |
            analysis-state-v1-${{ runner.os }}-${{ hashFiles('uv.lock', 'docker/msvc600/**', 'config/static-libraries.yml') }}-
      - name: Run repository checks and Python tests
        run: uv run wiz8 check
      - name: Run clang-cl and clang-tidy lints
        run: uv run wiz8 lint

  analysis:
    name: Ghidra and recovery integration
    needs: [scope, toolchain]
    if: needs.scope.outputs.analysis == 'true' && needs.toolchain.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install host analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends llvm unzip
          command -v llvm-undname
      - name: Load VC6 product image
        uses: ./.github/actions/load-vc6-product
      - name: Install pinned Ghidra
        run: |
          archive="$RUNNER_TEMP/$GHIDRA_ARCHIVE"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.4_build/$GHIDRA_ARCHIVE"
          echo "$GHIDRA_SHA256  $archive" | sha256sum --check -
          mkdir -p "$(dirname "$GHIDRA_INSTALL_DIR")"
          unzip -q "$archive" -d "$(dirname "$GHIDRA_INSTALL_DIR")"
          test -x "$GHIDRA_INSTALL_DIR/support/analyzeHeadless"
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Run recovery lifecycle self-test
        run: uv run wiz8 recover self-test
      - name: Restore reviewed Ghidra checkpoint
        run: uv run wiz8 ghidra restore
      - name: Run Ghidra enrichment integration tests
        run: uv run pytest -q tests/ghidra

  wiz8:
    name: WIZ8 comparison
    needs: [scope, toolchain]
    if: >-
      needs.scope.outputs.wiz8_compare == 'true' &&
      needs.toolchain.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      reccmp-status: ${{ steps.wiz8-checks.outputs.status }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install WIZ8 comparison host tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            innoextract llvm wine wine32:i386 wine64
          mkdir -p "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR"
          mkdir -p \
            "$WIZ8_WORK_DIR/fid/sources/unpacked/zlib-1.0.4/zlib-1.0.4" \
            "$WIZ8_WORK_DIR/fid/sources/unpacked/ijg-jpeg-6/jpeg-6" \
            "$WIZ8_WORK_DIR/fid/sources/unpacked/infozip-unzip-5.4"
          command -v llvm-undname
          command -v wine
      # The analysis image indexes the source every comparison reads.
      - name: Load VC6 analysis image
        uses: ./.github/actions/load-vc6-image
      - name: Load VC6 product image
        if: github.event_name != 'pull_request'
        uses: ./.github/actions/load-vc6-product
      - name: Restore incremental WIZ8 comparison build
        uses: actions/cache@v4
        with:
          path: build/decomp
          key: product-wiz8-comparison-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/static-libraries.yml') }}-${{ github.sha }}
          restore-keys: |
            product-wiz8-comparison-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/static-libraries.yml') }}-
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Prepare minimal WIZ8 comparison inputs
        uses: ./.github/actions/prepare-comparison-inputs
        with:
          inputs-token: ${{ secrets.WIZ8_INPUTS_TOKEN }}
          cache-key: ${{ secrets.WIZ8_CACHE_KEY }}
      - name: Build WIZ8 comparison products
        run: uv run wiz8 build match
      # reccmp reads markers from the compiler-backed source index, so every
      # comparison needs it (call verification below uses it too).
      - name: Index source
        run: uv run wiz8 analyze source-index
      - name: Verify changed WIZ8 call targets
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          uv run wiz8 verify-call-targets --base "${{ github.event.pull_request.base.sha }}"
      - name: Run WIZ8 comparisons
        id: wiz8-checks
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          status_json="$RUNNER_TEMP/reccmp-status.json"
          comparison_status=0

          if uv run wiz8 report status > "$status_json"; then
            jq -e '.targets.WIZ8.state == "comparison"' "$status_json" >/dev/null || comparison_status=1
          else
            comparison_status=1
          fi

          if [[ -s "$status_json" ]]; then
            status_row="$(
              jq -c '.targets.WIZ8 | {state, source, comparison, original_functions, source_coverage, progress}' "$status_json"
            )"
            printf 'status=%s\n' "$status_row" >> "$GITHUB_OUTPUT"
          fi

          vtable_status=0
          datacmp_status=0
          uv run wiz8 vtable || vtable_status=$?
          uv run wiz8 datacmp || datacmp_status=$?
          if (( vtable_status != 0 || datacmp_status != 0 )); then
            echo "::warning::specialized WIZ8 comparison debt: vtable=$vtable_status datacmp=$datacmp_status"
          fi

          # Declared equivalence groups are trusted by reccmp; re-prove them
          # against the original image so a stale row cannot mask a regression.
          uv run wiz8 equivalence || comparison_status=1

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            uv run pytest -q tests/licensed || comparison_status=1
          fi

          echo "comparison_status=$comparison_status"
          exit "$comparison_status"

      - name: Upload WIZ8 comparison logs
        if: steps.wiz8-checks.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: wiz8-comparison-logs
          path: build/logs/
          if-no-files-found: warn
      - name: Fail if WIZ8 checks failed
        if: steps.wiz8-checks.outcome == 'failure'
        run: exit 1
      - name: Remove plaintext licensed WIZ8 inputs
        if: always()
        run: |
          wineserver -k || true
          rm -rf "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR" "$RUNNER_TEMP/wiz8-gog-download" config/local-inputs.yml

  wiz8-runtime:
    name: WIZ8 runtime tests
    needs: [scope, toolchain]
    if: >-
      needs.scope.outputs.wiz8_runtime == 'true' &&
      needs.toolchain.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install WIZ8 runtime host tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            innoextract llvm wine wine32:i386 wine64 xvfb
          mkdir -p "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR"
          command -v llvm-undname
          command -v wine
      - name: Load VC6 analysis image
        uses: ./.github/actions/load-vc6-image
      - name: Restore compiler-backed analysis cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/clang
            build/reccmp-source
            build/source-index.json
          key: analysis-state-v1-${{ runner.os }}-${{ hashFiles('uv.lock', 'docker/msvc600/**', 'config/static-libraries.yml') }}-${{ github.sha }}
          restore-keys: |
            analysis-state-v1-${{ runner.os }}-${{ hashFiles('uv.lock', 'docker/msvc600/**', 'config/static-libraries.yml') }}-
      - name: Restore incremental WIZ8 product build
        uses: actions/cache@v4
        with:
          path: build/decomp
          key: product-wiz8-runtime-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/static-libraries.yml') }}-${{ github.sha }}
          restore-keys: |
            product-wiz8-runtime-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/static-libraries.yml') }}-
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Prepare licensed WIZ8 inputs
        uses: ./.github/actions/prepare-licensed-inputs
        with:
          inputs-token: ${{ secrets.WIZ8_INPUTS_TOKEN }}
          cache-key: ${{ secrets.WIZ8_CACHE_KEY }}
      - name: Build WIZ8 runtime product
        run: uv run wiz8 build runtime-test
      - name: Run WIZ8 runtime tests
        id: wiz8-runtime
        continue-on-error: true
        env:
          RUNTIME_RENDERER: ${{ inputs.renderer || 'default' }}
          WIZ8_RUNTIME_RUNNER: wine
          WIZ8_RUNTIME_VIDEO_CONFIG: config/runtime/3DVideo.Software.CFG
        shell: bash
        run: |
          set -uo pipefail
          if [[ "$RUNTIME_RENDERER" == "softpipe" ]]; then export GALLIUM_DRIVER=softpipe; fi
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            status=0
            uv run wiz8 runtime-test --repeat 3 \
              --scenario main-game-start --scenario save-load-move \
              --scenario combat-roundtrip --scenario hostile-encounter || status=1
            uv run wiz8 runtime-test --scenario world-soak || status=1
            exit "$status"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            uv run wiz8 runtime-test
          else
            uv run wiz8 runtime-test --tier main --check-order
          fi
      - name: Upload WIZ8 diagnostics
        if: steps.wiz8-runtime.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: wiz8-runtime-diagnostics
          path: |
            build/runtime/runtime-test/**/diagnostics/
            build/logs/
          if-no-files-found: warn
      - name: Fail if WIZ8 runtime tests failed
        if: steps.wiz8-runtime.outcome == 'failure'
        run: exit 1
      - name: Remove plaintext licensed WIZ8 inputs
        if: always()
        run: |
          wineserver -k || true
          rm -rf "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR" "$RUNNER_TEMP/wiz8-gog-download" config/local-inputs.yml

  surrender:
    name: SURRENDER comparison
    needs: [scope, toolchain]
    if: >-
      needs.scope.outputs.surrender == 'true' &&
      needs.toolchain.result == 'success' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      reccmp-status: ${{ steps.surrender-status.outputs.status }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
      - name: Install SURRENDER comparison host tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            innoextract llvm wine wine32:i386 wine64
          mkdir -p "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR"
          command -v llvm-undname
          command -v wine
          command -v winepath
      - name: Load VC6 product image
        uses: ./.github/actions/load-vc6-product
      - name: Restore incremental SURRENDER product build
        uses: actions/cache@v4
        with:
          path: build/decomp
          key: product-surrender-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/static-libraries.yml') }}-${{ github.sha }}
          restore-keys: |
            product-surrender-v2-${{ runner.os }}-${{ hashFiles('docker/msvc600/**', 'config/static-libraries.yml') }}-
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Prepare minimal SURRENDER comparison inputs
        uses: ./.github/actions/prepare-comparison-inputs
        with:
          inputs-token: ${{ secrets.WIZ8_INPUTS_TOKEN }}
          cache-key: ${{ secrets.WIZ8_CACHE_KEY }}
      - name: Build SURRENDER comparison product
        run: uv run wiz8 build SURRENDER
      - name: Load VC6 analysis image
        uses: ./.github/actions/load-vc6-image
      # reccmp reads markers from the compiler-backed source index.
      - name: Index source
        run: uv run wiz8 analyze source-index
      - name: Verify SURRENDER comparison surface
        id: surrender-status
        run: |
          status_json="$RUNNER_TEMP/surrender-status.json"
          uv run wiz8 report status > "$status_json"
          # error_count covers live reccmp diagnostics; unpaired_line_refs covers
          # the same "Failed to find function symbol" failures when the prepared
          # analysis cache serves the engine without re-emitting log records.
          jq -e '
            .targets.SURRENDER.state == "comparison"
            and .targets.SURRENDER.diagnostics.error_count == 0
            and .targets.SURRENDER.comparison.unpaired_line_refs == 0
          ' "$status_json" >/dev/null
          jq '.targets.SURRENDER' "$status_json"
          status_row="$(
            jq -c '.targets.SURRENDER | {state, source, comparison, original_functions, source_coverage, progress}' "$status_json"
          )"
          printf 'status=%s\n' "$status_row" >> "$GITHUB_OUTPUT"
      - name: Remove plaintext licensed SURRENDER inputs
        if: always()
        run: rm -rf "$WIZ8_INPUT_DIR" "$WIZ8_WORK_DIR" "$RUNNER_TEMP/wiz8-gog-download" config/local-inputs.yml

  ci:
    name: Public checks, lints, and tests
    needs: [scope, toolchain, repository, analysis, wiz8, wiz8-runtime, surrender]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected lane to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          TOOLCHAIN_RESULT: ${{ needs.toolchain.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          ANALYSIS_RESULT: ${{ needs.analysis.result }}
          WIZ8_RESULT: ${{ needs.wiz8.result }}
          WIZ8_RUNTIME_RESULT: ${{ needs['wiz8-runtime'].result }}
          SURRENDER_RESULT: ${{ needs.surrender.result }}
        run: |
          set -euo pipefail
          for result in "$SCOPE_RESULT" "$TOOLCHAIN_RESULT" "$REPOSITORY_RESULT" "$ANALYSIS_RESULT" "$WIZ8_RESULT" "$WIZ8_RUNTIME_RESULT" "$SURRENDER_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "selected CI lane failed or was cancelled: $result" >&2; exit 1 ;;
            esac
          done

  comment-reccmp-status:
    name: Comment reccmp status
    needs: [wiz8, surrender]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (needs.wiz8.result == 'success' && needs.wiz8.outputs.reccmp-status != '') ||
        (needs.surrender.result == 'success' && needs.surrender.outputs.reccmp-status != '')
      )
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WIZ8_STATUS: ${{ needs.wiz8.outputs.reccmp-status }}
          SURRENDER_STATUS: ${{ needs.surrender.outputs.reccmp-status }}
        shell: bash
        run: |
          set -euo pipefail
          rows="$(
            jq -cn \
              --arg wiz8 "$WIZ8_STATUS" \
              --arg surrender "$SURRENDER_STATUS" '
                [
                  (if $wiz8 != "" then {key: "WIZ8", value: ($wiz8 | fromjson)} else empty end),
                  (if $surrender != "" then {key: "SURRENDER", value: ($surrender | fromjson)} else empty end)
                ]
              '
          )"
          test "$(jq 'length' <<<"$rows")" -gt 0

          comment="$RUNNER_TEMP/reccmp-status.md"
          jq -nr --argjson rows "$rows" '
            def pct:
              if . == null then "n/a"
              else (((. * 10000 | round) / 100) | tostring) + "%"
              end;
            ($rows | map(select(.value.state == "comparison"))) as $comparison |
            ($comparison | map(select(.value.original_functions != null))) as $known |
            ($comparison | map(.value.source.functions // 0) | add // 0) as $source |
            ($comparison | map(.value.comparison.paired // 0) | add // 0) as $paired |
            ($comparison | map(.value.comparison.exact // 0) | add // 0) as $exact |
            ($comparison | map(.value.comparison.effective // 0) | add // 0) as $effective |
            ($comparison | map(.value.comparison.mismatch // 0) | add // 0) as $mismatch |
            ($comparison | map(.value.comparison.inconclusive // 0) | add // 0) as $inconclusive |
            ($comparison | map(.value.comparison.unpaired // 0) | add // 0) as $unpaired |
            ($comparison | map(.value.comparison.ignored // 0) | add // 0) as $ignored |
            (
              $comparison
              | map((.value.comparison.accuracy // 0) * (.value.comparison.paired // 0))
              | add // 0
            ) as $score |
            ($known | map(.value.original_functions) | add // 0) as $original |
            ($known | map(.value.source.functions // 0) | add // 0) as $known_source |
            (
              $known
              | map((.value.progress // 0) * .value.original_functions)
              | add // 0
            ) as $known_score |
            (
              [
                "<!-- wiz8-reccmp-status -->",
                "### reccmp status",
                "",
                "_Only comparison lanes selected and completed for this CI run are included._",
                "",
                "| Metric | Value |",
                "| --- | ---: |",
                "| Source functions | \($source) |",
                "| Source coverage (known scope) | \($known_source) / \($original) (\((if $original > 0 then ($known_source / $original) else null end) | pct)) |",
                "| Effective progress (known scope) | \((if $original > 0 then ($known_score / $original) else null end) | pct) |",
                "| Paired source functions | \($paired) |",
                "| Exact | \($exact) |",
                "| Effective | \($effective) |",
                "| Mismatch | \($mismatch) |",
                "| Inconclusive | \($inconclusive) |",
                "| Unpaired | \($unpaired) |",
                "| Ignored | \($ignored) |",
                "| Pair accuracy | \((if $paired > 0 then ($score / $paired) else 0 end) | pct) |",
                "",
                "#### Per target",
                "",
                "| Target | Source | Coverage | Progress | Exact | Effective | Mismatch | Inconclusive | Unpaired | Accuracy |",
                "| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |"
              ]
              + (
                  $comparison
                  | map(
                      .value as $v
                      | "| `\(.key)` | \($v.source.functions // 0) | \($v.source_coverage | pct) | \($v.progress | pct) | \($v.comparison.exact) | \($v.comparison.effective) | \($v.comparison.mismatch) | \($v.comparison.inconclusive) | \($v.comparison.unpaired) | \($v.comparison.accuracy | pct) |"
                    )
                )
              + [""]
            ) | join("\n")
          ' > "$comment"
          printf '\n_Updated from CI merge result `%s`._\n' "${GITHUB_SHA:0:12}" >> "$comment"

          marker='<!-- wiz8-reccmp-status -->'
          payload="$RUNNER_TEMP/reccmp-status-comment.json"
          comment_id="$(
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n1
          )"
          jq -Rs '{body: .}' < "$comment" > "$payload"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --input "$payload" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$payload" >/dev/null
          fi
