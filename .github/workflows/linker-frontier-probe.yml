name: Linker frontier probe

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python environment
        run: uv sync --frozen

      - name: Prepare public source inputs
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/ci-sources

          # WIZ8 itself links zlib, so use the exact confirmed source.
          curl -L --fail --retry 3 --max-time 120 -o build/ci-sources/zlib.tar.gz \
            https://zlib.net/fossils/zlib-1.0.4.tar.gz
          echo 'e5c260cd3db1370fb3e0c193e9cbd9f127a9bd055d622b3fb55b82747f6e5b24  build/ci-sources/zlib.tar.gz' | sha256sum -c -
          tar -C build/ci-sources -xzf build/ci-sources/zlib.tar.gz

          # JPEG and Info-ZIP belong to separate DLL targets. CMake needs their
          # source paths to exist at generation time, but WIZ8 never builds them.
          python - <<'PY'
          from pathlib import Path

          def materialize(cmake_path: str, variable: str, root: str) -> None:
              text = Path(cmake_path).read_text(encoding='utf-8')
              block = text.split(f'set({variable}', 1)[1].split(')', 1)[0]
              root_path = Path(root)
              for token in block.split():
                  if token.endswith(('.c', '.cpp')):
                      path = root_path / token
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.touch()

          materialize(
              'src/srext_jpegimporter/CMakeLists.txt',
              'IJG_JPEG_UNITS',
              'build/ci-sources/jpeg-6',
          )
          materialize(
              'src/srext_unzip/CMakeLists.txt',
              'INFOZIP_UNZIP_SOURCES',
              'build/ci-sources/infozip',
          )
          PY

      - name: Build pinned VC6 image
        run: docker build -f docker/msvc600/Dockerfile -t wizardry8-msvc600:sp5 .

      - name: Configure matching build
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/decomp/tmp
          uv run python -c 'from pathlib import Path; from wiz8decomp.build import _write_sr_assert_import; _write_sr_assert_import(Path.cwd())'
          docker run --rm --init --network none \
            --volume "$PWD:/repo:ro" \
            --volume "$PWD/build/ci-sources/jpeg-6:/jpeg:ro" \
            --volume "$PWD/build/ci-sources/zlib-1.0.4:/zlib:ro" \
            --volume "$PWD/build/ci-sources/infozip:/infozip:ro" \
            --volume "$PWD/build/decomp:/out" \
            wizardry8-msvc600:sp5 \
            'C:\cmake\bin\cmake.exe' \
            -S Z:/repo -B Z:/out -G 'NMake Makefiles' \
            -DIJG_JPEG_SOURCE=Z:/jpeg \
            -DZLIB_SOURCE=Z:/zlib \
            -DINFOZIP_SOURCE=Z:/infozip \
            -DSGP_SOURCE=Z:/repo/third_party/sfi-sgp/sgp \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build comparison image
        shell: bash
        run: |
          set -euxo pipefail
          docker run --rm --init --network none \
            --volume "$PWD:/repo:ro" \
            --volume "$PWD/build/ci-sources/jpeg-6:/jpeg:ro" \
            --volume "$PWD/build/ci-sources/zlib-1.0.4:/zlib:ro" \
            --volume "$PWD/build/ci-sources/infozip:/infozip:ro" \
            --volume "$PWD/build/decomp:/out" \
            wizardry8-msvc600:sp5 \
            'C:\cmake\bin\cmake.exe' -E env \
            'TEMP=Z:\out\tmp' 'TMP=Z:\out\tmp' \
            'C:\cmake\bin\cmake.exe' --build Z:/out --target WIZ8 --parallel 2

      - name: Measure unresolved frontier
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          from wiz8decomp.unresolved import unresolved_report

          report = unresolved_report(
              Path('build/decomp/CMakeFiles/wiz8_recovered_objects.dir'),
              Path('build/decomp/Wiz8.map'),
          )
          Path('build/unresolved-frontier.json').write_text(
              json.dumps(report, indent=2) + '\n', encoding='utf-8'
          )
          print(f"UNRESOLVED_SYMBOLS={report['unresolved_symbols']}")
          print(f"UNITS_WITH_UNRESOLVED={report['units_with_unresolved']}")
          for row in report['ranked_units'][:20]:
              print(f"{row['unresolved_count']:4d} {row['unit']}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: unresolved-frontier
          path: build/unresolved-frontier.json
