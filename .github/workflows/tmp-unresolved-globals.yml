name: tmp unresolved globals
on:
  push:
    branches: [agent/reduce-unresolved-under-700]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find baseline globals still lacking source definitions
        shell: python
        run: |
          import csv, pathlib, re

          source_suffixes = {'.c', '.cc', '.cpp', '.h', '.hpp'}
          baseline = {}
          with open('config/verification/unresolved-baseline.csv', newline='') as f:
              for row in csv.DictReader(f):
                  mangled = row['symbol']
                  m = re.match(r'\?([A-Za-z_$][A-Za-z0-9_$]*)@@3', mangled)
                  if not m:
                      m = re.match(r'_(g_[A-Za-z0-9_$]+)$', mangled)
                  if m:
                      baseline.setdefault(m.group(1), set()).add(mangled)

          occ = {name: [] for name in baseline}
          defined = set()
          ident = re.compile(r'\b(?:g_[A-Za-z0-9_$]+|ghWindow)\b')

          def is_definition(line, name):
              s = line.strip()
              if not s or s.startswith(('/', '*', '#')) or 'extern ' in s:
                  return False
              pos = s.find(name)
              before = s[:pos].strip()
              after = s[pos + len(name):].lstrip()
              if not before or '(' in before or '=' in before:
                  return False
              return re.match(r'^(?:\[[^\]]*\]\s*)*(?:=|;)', after) is not None

          for base in ('src', 'include'):
              for path in pathlib.Path(base).rglob('*'):
                  if path.suffix.lower() not in source_suffixes:
                      continue
                  for no, line in enumerate(path.read_text(errors='ignore').splitlines(), 1):
                      for name in set(ident.findall(line)) & baseline.keys():
                          occ[name].append((path, no, line.strip()))
                          if is_definition(line, name):
                              defined.add(name)

          missing = [(name, sorted(baseline[name]), occ[name]) for name in sorted(baseline) if occ[name] and name not in defined]
          print(f'candidate_count={len(missing)}')
          for name, mangled, uses in missing:
              print(f'\n{name}\t{" | ".join(mangled)}')
              for path, no, line in uses[:10]:
                  print(f'  {path}:{no}: {line}')
