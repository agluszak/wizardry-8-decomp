name: tmp unresolved count
on:
  push:
    branches: [agent/reduce-unresolved-under-700]

jobs:
  unresolved:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          "$HOME/.local/bin/uv" python install 3.13
          mkdir -p /tmp/wiz8-input /tmp/wiz8-work
      - name: Build pinned VC6 image and source dependencies
        env:
          GHIDRA_INSTALL_DIR: /tmp/unused-ghidra
          WIZ8_INPUT_DIR: /tmp/wiz8-input
          WIZ8_WORK_DIR: /tmp/wiz8-work
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run wiz8 toolchain build vc6-sp5
          uv run python - <<'PY'
          from wiz8decomp.config import load_settings
          from wiz8decomp.ghidra.fid_seeds import fetch_seed_sources
          from wiz8decomp.build import _write_sr_assert_import
          from wiz8decomp.reccmp_data import write_wiz8_data_source
          s = load_settings()
          fetch_seed_sources(s)
          write_wiz8_data_source(s.repo_dir)
          _write_sr_assert_import(s.repo_dir)
          PY
      - name: Build MATCH image and count unresolved symbols
        env:
          GHIDRA_INSTALL_DIR: /tmp/unused-ghidra
          WIZ8_INPUT_DIR: /tmp/wiz8-input
          WIZ8_WORK_DIR: /tmp/wiz8-work
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run wiz8 build match -j 4
          uv run wiz8 analyze unresolved
